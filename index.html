<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>فيلماتي | سينما وأفلام ومسلسلات بجودة فائقة</title>
  <!-- Telegram WebApp JS -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#e50914',
              gold: '#f59e0b',
              dark: '#0b0f19',
              card: '#161e2e',
              border: '#26334d'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
    * { font-family: 'Cairo', system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f19; color: #f8fafc; }
    .glass { background: rgba(22, 30, 46, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass border-b border-brand-border px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <button id="menuBtn" aria-label="القائمة" class="w-9 h-9 rounded-xl bg-brand-card border border-brand-border text-white text-lg font-bold flex items-center justify-center hover:border-red-500 transition">☰</button>
      <span class="text-2xl">🎬</span>
      <h1 class="text-xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-400 to-yellow-300">
        فيلماتي <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-red-600/30 text-red-400 border border-red-500/40">VIP</span>
      </h1>
    </div>
    <div class="flex items-center gap-2">
      <a href="Tv/" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-bold hover:bg-amber-500 hover:text-white transition">
        <span>📺 وضع التلفزيون</span>
      </a>
      <a href="https://t.me/filmatibot" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs font-bold hover:bg-blue-600 hover:text-white transition">
        <span>🤖 البوت في التليجرام</span>
      </a>
    </div>
  </header>

  <!-- Side drawer (hamburger menu): categories by language, top-rated, collections -->
  <div id="drawerOverlay" class="fixed inset-0 z-[55] bg-black/70 hidden"></div>
  <aside id="sideDrawer" class="fixed inset-y-0 right-0 z-[60] w-72 max-w-[85vw] bg-brand-card border-l border-brand-border shadow-2xl overflow-y-auto transition-transform duration-300 translate-x-full" aria-label="قائمة التصنيفات">
    <div class="sticky top-0 z-10 flex items-center justify-between px-4 py-3 bg-brand-card border-b border-brand-border">
      <span class="text-base font-extrabold text-white">☰ القائمة</span>
      <button id="drawerClose" aria-label="إغلاق القائمة" class="w-8 h-8 rounded-full bg-slate-800 text-white flex items-center justify-center hover:bg-red-600 transition">✕</button>
    </div>
    <nav class="p-3 space-y-1 text-sm font-bold">
      <div>
        <button class="drawer-group-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-slate-800/70 text-white hover:bg-slate-800 transition" data-group="movies">
          <span>🎬 أفلام</span><span class="drawer-arrow text-slate-400">▾</span>
        </button>
        <div id="drawer-movies" class="drawer-sub hidden pr-3 pt-1 space-y-1">
          <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="movie" data-lang="ar">عربي</button>
          <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="movie" data-lang="en" data-origin="US">🇺🇸 إنجليزي (أمريكي)</button>
          <div>
            <button class="drawer-group-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-group="movies-other">
              <span>🌍 لغات أخرى</span><span class="drawer-arrow text-slate-400">▾</span>
            </button>
            <div id="drawer-movies-other" class="drawer-sub hidden pr-3 pt-1 space-y-1">
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="movie" data-lang="hi">هندي</button>
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="movie" data-lang="tr">تركي</button>
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="movie" data-lang="ko">كوري</button>
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="movie" data-lang="es">إسباني</button>
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="movie" data-lang="fr">فرنسي</button>
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="movie" data-lang="ja">ياباني</button>
            </div>
          </div>
        </div>
      </div>
      <div>
        <button class="drawer-group-btn w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-slate-800/70 text-white hover:bg-slate-800 transition" data-group="tv">
          <span>📺 مسلسلات</span><span class="drawer-arrow text-slate-400">▾</span>
        </button>
        <div id="drawer-tv" class="drawer-sub hidden pr-3 pt-1 space-y-1">
          <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="tv" data-lang="ar">عربي</button>
          <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="tv" data-lang="en" data-origin="US">🇺🇸 إنجليزي (أمريكي)</button>
          <div>
            <button class="drawer-group-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-group="tv-other">
              <span>🌍 لغات أخرى</span><span class="drawer-arrow text-slate-400">▾</span>
            </button>
            <div id="drawer-tv-other" class="drawer-sub hidden pr-3 pt-1 space-y-1">
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="tv" data-lang="hi">هندي</button>
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="tv" data-lang="tr">تركي</button>
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="tv" data-lang="ko">كوري</button>
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="tv" data-lang="es">إسباني</button>
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="tv" data-lang="fr">فرنسي</button>
              <button class="drawer-lang w-full text-right px-3 py-2 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition" data-type="tv" data-lang="ja">ياباني</button>
            </div>
          </div>
        </div>
      </div>
      <button id="drawerTopRated" class="w-full text-right px-3 py-2.5 rounded-xl text-white hover:bg-slate-800 transition">⭐ الأعلى تقييمًا</button>
      <button id="drawerMarvel" class="w-full text-right px-3 py-2.5 rounded-xl text-white hover:bg-slate-800 transition">🦸‍♂️ مارفل</button>
      <button id="drawerNetflix" class="w-full text-right px-3 py-2.5 rounded-xl text-white hover:bg-slate-800 transition">🔴 نتفليكس</button>
    </nav>
  </aside>

  <!-- Hero / Search Section -->
  <section class="p-4 max-w-4xl mx-auto w-full">
    <div class="relative">
      <input
        id="searchInput"
        type="text"
        placeholder="ابحث عن فيلم، مسلسل، Marvel، Netflix..."
        class="w-full bg-brand-card/90 text-white placeholder-slate-400 rounded-2xl py-3.5 pr-12 pl-10 border border-brand-border focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/30 transition text-sm"
      />
      <span class="absolute right-4 top-3.5 text-slate-400 text-lg">🔍</span>
      <button id="clearSearch" class="hidden absolute left-3 top-3 text-slate-400 hover:text-white text-sm bg-slate-800 rounded-full w-6 h-6 flex items-center justify-center">✕</button>
      <!-- Search suggestions dropdown (stage E) -->
      <div id="searchSuggest" class="hidden absolute right-0 left-0 top-full mt-2 bg-brand-card border border-brand-border rounded-2xl shadow-2xl z-40 overflow-hidden"></div>
    </div>

    <!-- Quick Filters -->
    <div class="flex gap-2 overflow-x-auto scrollbar-hide py-3 mt-1 text-xs font-bold">
      <button class="filter-btn active whitespace-nowrap px-4 py-2 rounded-xl bg-red-600 text-white transition" data-filter="trending">🔥 الأكثر رواجاً</button>
      <button class="filter-btn whitespace-nowrap px-4 py-2 rounded-xl bg-brand-card text-slate-300 border border-brand-border hover:border-slate-500 transition" data-filter="movie">🎬 أفلام</button>
      <button class="filter-btn whitespace-nowrap px-4 py-2 rounded-xl bg-brand-card text-slate-300 border border-brand-border hover:border-slate-500 transition" data-filter="tv">📺 مسلسلات</button>
      <button class="filter-btn whitespace-nowrap px-4 py-2 rounded-xl bg-brand-card text-slate-300 border border-brand-border hover:border-slate-500 transition" data-filter="marvel">🦸‍♂️ مارفل</button>
      <button class="filter-btn whitespace-nowrap px-4 py-2 rounded-xl bg-brand-card text-slate-300 border border-brand-border hover:border-slate-500 transition" data-filter="netflix">🔴 نتفليكس</button>
    </div>
  </section>

  <!-- Main Content Grid -->
  <main class="flex-1 max-w-5xl mx-auto w-full px-4">
    <!-- Section Title -->
    <div id="gridHeader" class="flex items-center justify-between mb-3">
      <h2 id="sectionTitle" class="text-base font-extrabold text-white flex items-center gap-2">
        <span>🔥</span> <span>الأعمال الأكثر رواجاً اليوم</span>
      </h2>
      <span id="itemsCount" class="text-xs text-slate-400 font-semibold"></span>
    </div>

    <!-- Media Cards Grid -->
    <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5">
      <!-- Loading placeholders -->
      <div class="animate-pulse bg-brand-card rounded-2xl h-64 border border-brand-border"></div>
      <div class="animate-pulse bg-brand-card rounded-2xl h-64 border border-brand-border"></div>
      <div class="animate-pulse bg-brand-card rounded-2xl h-64 border border-brand-border"></div>
      <div class="animate-pulse bg-brand-card rounded-2xl h-64 border border-brand-border"></div>
      <div class="animate-pulse bg-brand-card rounded-2xl h-64 border border-brand-border"></div>
    </div>

    <!-- Home Sections (most-watched first, then top-rated; year filter chips) -->
    <div id="homeSections" class="hidden space-y-8"></div>
  </main>

  <!-- Media Details & Player Modal -->
  <div id="mediaModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-brand-card border border-brand-border rounded-t-3xl sm:rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl relative">
      <!-- Close button -->
      <button id="closeModal" class="absolute top-3 left-3 z-20 w-8 h-8 rounded-full bg-slate-900/80 text-white flex items-center justify-center hover:bg-red-600 transition">✕</button>

      <!-- Video Player Frame Area -->
      <div id="playerContainer" class="hidden relative aspect-video w-full bg-black">
        <iframe id="videoIframe" class="w-full h-full" src="" allowfullscreen frameborder="0" referrerpolicy="origin" allow="fullscreen; autoplay; encrypted-media"></iframe>
        <video id="videoNative" class="hidden w-full h-full bg-black" controls playsinline preload="metadata"></video>
        <div id="playerStatus" class="hidden absolute inset-0 flex items-center justify-center bg-black/70 text-white text-sm font-bold px-4 text-center"></div>
      </div>

      <!-- Modal Content Body -->
      <div class="p-5 overflow-y-auto space-y-4">
        <!-- Auto-next episode countdown (series only, native player) -->
        <div id="autoNextBar" class="hidden items-center justify-between gap-2 rounded-xl bg-red-600/15 border border-red-500/30 px-3 py-2">
          <span id="autoNextText" class="text-xs font-bold text-white">الحلقة التالية خلال 5 ثواني…</span>
          <span class="flex gap-2 shrink-0">
            <button id="btnAutoNextNow" class="px-3 py-1.5 rounded-lg bg-red-600 text-white text-[11px] font-bold">تشغيل الآن</button>
            <button id="btnAutoNextCancel" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-bold border border-slate-700">إلغاء</button>
          </span>
        </div>
        <div class="flex gap-4">
          <img id="modalPoster" src="" alt="Poster" class="w-24 h-36 object-cover rounded-xl shadow-md border border-brand-border flex-shrink-0 bg-slate-900" />
          <div class="flex-1 min-w-0">
            <h3 id="modalTitle" class="text-lg font-black text-white leading-tight"></h3>
            <div class="flex flex-wrap items-center gap-2 mt-1.5 text-xs">
              <span id="modalRating" class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 font-bold border border-amber-500/30">⭐ 8.5</span>
              <span id="modalYear" class="text-slate-400 font-semibold">2026</span>
              <span id="modalKind" class="px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 font-semibold">فيلم</span>
            </div>
            <p id="modalStory" class="text-slate-300 text-xs mt-2.5 line-clamp-2 leading-relaxed"></p>
          </div>
        </div>

        <!-- Series Seasons & Episodes Picker (Visible if TV show) -->
        <div id="seriesControls" class="hidden space-y-3 pt-2 border-t border-brand-border">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-slate-300">الموسم:</label>
            <select id="seasonSelect" class="bg-slate-800 text-white text-xs rounded-xl px-3 py-1.5 border border-brand-border focus:outline-none"></select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-300 block mb-2">اختر الحلقة:</label>
            <div id="episodesGrid" class="grid grid-cols-4 sm:grid-cols-6 gap-2 max-h-40 overflow-y-auto pr-1"></div>
          </div>
        </div>

        <!-- Server & Quality Picker -->
        <div id="serverControls" class="hidden space-y-2 pt-2 border-t border-brand-border">
          <div>
            <label class="text-xs font-bold text-slate-300 block mb-1.5">السيرفر:</label>
            <div id="serversRow" class="flex flex-wrap gap-2"></div>
          </div>
          <div id="qualityWrap">
            <label class="text-xs font-bold text-slate-300 block mb-1.5">الجودة:</label>
            <div id="qualitiesRow" class="flex flex-wrap gap-2"></div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="pt-3 border-t border-brand-border space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <button id="btnPlayInApp" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-red-600 to-red-700 text-white font-bold text-xs flex items-center justify-center gap-2 hover:opacity-90 transition shadow-lg shadow-red-900/30">
              <span>▶️</span> <span id="btnPlayInAppLabel">مشاهدة فورية</span>
            </button>
            <button id="btnDirectDownload" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-700 text-white font-bold text-xs flex items-center justify-center gap-2 hover:opacity-90 transition shadow-lg shadow-emerald-900/30">
              <span>⬇️</span> <span>تحميل مباشر (.mp4)</span>
            </button>
          </div>
          <!-- Download quality picker (shown when more than one quality exists) -->
          <div id="downloadPicker" class="hidden space-y-2 pt-1">
            <label class="text-xs font-bold text-slate-300 block">اختر جودة التحميل:</label>
            <div id="downloadQualitiesRow" class="flex flex-wrap gap-2"></div>
          </div>
          <!-- Whole-season download (series only) -->
          <button id="btnDownloadSeason" class="hidden w-full py-2.5 px-4 rounded-xl bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 font-bold text-xs flex items-center justify-center gap-2 hover:bg-emerald-600 hover:text-white transition">⬇️ تحميل الموسم كامل</button>
          <div id="seasonDownloadPicker" class="hidden space-y-2 pt-1">
            <label class="text-xs font-bold text-slate-300 block">اختر جودة تحميل الموسم:</label>
            <div id="seasonDownloadQualitiesRow" class="flex flex-wrap gap-2"></div>
          </div>
          <div id="seasonDownloadProgress" class="hidden space-y-1 pt-1 max-h-32 overflow-y-auto pr-1">
            <label class="text-xs font-bold text-slate-300 block">تقدّم تحميل الموسم:</label>
            <div id="seasonDownloadList" class="space-y-1"></div>
          </div>
          <!-- Restart from the beginning (shown only when a saved position exists) -->
          <button id="btnRestartPlay" class="hidden w-full py-2 rounded-xl bg-slate-800 text-slate-300 border border-slate-700 font-bold text-[11px] hover:text-white transition">↺ تشغيل من الأول</button>
          <!-- My list toggle -->
          <button id="btnMyList" class="w-full py-2.5 px-4 rounded-xl bg-slate-800 text-slate-200 border border-slate-700 font-bold text-xs flex items-center justify-center gap-2 hover:border-red-500 transition">🤍 أضف لقائمتي</button>
          <!-- Trailer (shown only when TMDB has one) -->
          <button id="btnTrailer" class="hidden w-full py-2.5 px-4 rounded-xl bg-red-600/20 text-red-300 border border-red-500/30 font-bold text-xs flex items-center justify-center gap-2 hover:bg-red-600 hover:text-white transition">🎬 مشاهدة التريلر</button>
          <!-- Report a problem -->
          <button id="btnReport" class="w-full py-2.5 px-4 rounded-xl bg-slate-800 text-slate-300 border border-slate-700 font-bold text-xs flex items-center justify-center gap-2 hover:border-amber-500 hover:text-white transition">⚠️ بلّغ عن مشكلة في التشغيل</button>
          <div id="reportPicker" class="hidden space-y-2 pt-1">
            <label class="text-xs font-bold text-slate-300 block">إيه المشكلة؟</label>
            <div class="flex flex-wrap gap-2">
              <button class="report-problem-btn px-3 py-1.5 rounded-lg text-xs font-bold border bg-slate-800 border-slate-700 text-slate-300 hover:border-red-500 transition" data-problem="المشغّل مش شغال">المشغّل مش شغال</button>
              <button class="report-problem-btn px-3 py-1.5 rounded-lg text-xs font-bold border bg-slate-800 border-slate-700 text-slate-300 hover:border-red-500 transition" data-problem="الفيديو بيقطّع أو الجودة ضعيفة">الفيديو بيقطّع</button>
              <button class="report-problem-btn px-3 py-1.5 rounded-lg text-xs font-bold border bg-slate-800 border-slate-700 text-slate-300 hover:border-red-500 transition" data-problem="الصوت أو الترجمة فيها مشكلة">الصوت / الترجمة</button>
              <button class="report-problem-btn px-3 py-1.5 rounded-lg text-xs font-bold border bg-slate-800 border-slate-700 text-slate-300 hover:border-red-500 transition" data-problem="مشكلة تانية">مشكلة تانية</button>
            </div>
            <p class="text-[11px] text-slate-500">هيفتح تيليجرام بالنص جاهز — ابعته للبوت.</p>
          </div>
          <button id="btnOpenInBot" class="w-full py-2.5 px-4 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 font-bold text-xs flex items-center justify-center gap-2 hover:bg-blue-600 hover:text-white transition">
            <span>🚀</span> <span>طلب إرسال الفيديو عبر بوت التليجرام</span>
          </button>
        </div>

        <!-- Bot Code Panel (hidden until the bot button is tapped) -->
        <div id="botCodePanel" class="hidden space-y-3 pt-3 border-t border-brand-border">
          <div id="botCodeQualityWrap">
            <label class="text-xs font-bold text-slate-300 block mb-1.5">اختر الجودة لإرسالها عبر البوت:</label>
            <div id="botCodeQualitiesRow" class="flex flex-wrap gap-2"></div>
          </div>
          <div id="botCodeResult" class="hidden text-center space-y-2">
            <p class="text-xs text-slate-400">أرسل هذا الكود للبوت (صالح لمدة ساعة):</p>
            <p id="botCodeValue" class="text-3xl font-black tracking-[0.3em] text-amber-400 select-all" dir="ltr">…</p>
            <div class="flex gap-2 justify-center">
              <button id="btnCopyBotCode" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white text-xs font-bold">📋 نسخ الكود</button>
              <button id="btnOpenBotPlain" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">🚀 فتح البوت</button>
            </div>
            <button id="btnBotDeepLink" class="text-[11px] text-slate-500 underline">أو: فتح البوت برابط مباشر للفيلم</button>
          </div>
        </div>

        <!-- Similar titles (stage D) -->
        <div id="similarWrap" class="hidden pt-3 border-t border-brand-border">
          <h4 class="text-sm font-extrabold text-white mb-2">🎬 أعمال شبه ده</h4>
          <div id="similarRow" class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://filmaty.hudhaifa-bio.workers.dev';
    const TMDB_KEY = '15d2ea6d0dc1d476efbca3eba2b9bbfb';
    const TMDB_BASE = 'https://api.themoviedb.org/3';
    const IMG_BASE = 'https://image.tmdb.org/t/p/w500';

    let currentItem = null;
    let selectedSeason = 1;
    let selectedEpisode = 1;
    let debounceTimer = null;
    // Last successful /api/resolve result, reused by the download button
    // without a second request. { key: 'movie:550:0:0', data: {...} }
    let lastResolved = null;
    // Server + quality selection for the last resolved title/episode.
    let currentServers = null;
    let selectedServerIdx = 0;
    let selectedQualityIdx = 0;

    // Continue watching (stage A): resume positions + watched marks,
    // kept in localStorage on this device only (no accounts). The TV
    // page uses the exact same keys and the same shape.
    const PROGRESS_KEY = 'filmaty:progress:v1';
    const WATCHED_KEY = 'filmaty:watched:v1';
    const MAX_PROGRESS_ITEMS = 20;
    function progressKey(type, id, s, e) {
      return `${type}:${id}:${s || 0}:${e || 0}`;
    }
    function readProgressStore() {
      try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); } catch (e) { return {}; }
    }
    function readWatchedStore() {
      try { return JSON.parse(localStorage.getItem(WATCHED_KEY) || '{}'); } catch (e) { return {}; }
    }
    function getProgress(type, id, s, e) {
      return readProgressStore()[progressKey(type, id, s, e)] || null;
    }
    function isWatched(type, id, s, e) {
      return !!readWatchedStore()[progressKey(type, id, s, e)];
    }
    function saveProgressEntry(type, id, s, e, t, d, meta) {
      if (!Number.isFinite(t) || t < 5) return;
      const store = readProgressStore();
      const key = progressKey(type, id, s, e);
      store[key] = {
        type, id, s: s || 0, e: e || 0,
        t: Math.floor(t), d: Number.isFinite(d) && d > 0 ? Math.floor(d) : 0,
        updated: Date.now(), title: meta.title || '', poster: meta.poster || '', kind: meta.kind || '',
      };
      const entries = Object.values(store).sort((a, b) => b.updated - a.updated).slice(0, MAX_PROGRESS_ITEMS);
      const capped = {};
      entries.forEach((en) => { capped[progressKey(en.type, en.id, en.s, en.e)] = en; });
      try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(capped)); } catch (e) {}
    }
    function clearProgressEntry(type, id, s, e) {
      const store = readProgressStore();
      delete store[progressKey(type, id, s, e)];
      try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(store)); } catch (e) {}
    }
    function markWatchedEntry(type, id, s, e) {
      const store = readWatchedStore();
      store[progressKey(type, id, s, e)] = Date.now();
      const keys = Object.keys(store).sort((a, b) => store[b] - store[a]).slice(0, 200);
      const capped = {};
      keys.forEach((k) => { capped[k] = store[k]; });
      try { localStorage.setItem(WATCHED_KEY, JSON.stringify(capped)); } catch (e) {}
      clearProgressEntry(type, id, s, e);
    }
    function formatTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
    }
    function getContinueItems() {
      return Object.values(readProgressStore()).sort((a, b) => b.updated - a.updated).slice(0, 10);
    }

    // My list (stage B): titles the user saved to watch later, kept in
    // localStorage on this device only (no accounts). Same keys on the
    // TV page.
    const MYLIST_KEY = 'filmaty:mylist:v1';
    const MAX_MYLIST_ITEMS = 50;
    function myListKey(type, id) {
      return `${type}:${id}`;
    }
    function readMyListStore() {
      try { return JSON.parse(localStorage.getItem(MYLIST_KEY) || '{}'); } catch (e) { return {}; }
    }
    function isInMyList(type, id) {
      return !!readMyListStore()[myListKey(type, id)];
    }
    function toggleMyList(type, id, meta) {
      const store = readMyListStore();
      const key = myListKey(type, id);
      if (store[key]) {
        delete store[key];
        try { localStorage.setItem(MYLIST_KEY, JSON.stringify(store)); } catch (e) {}
        return false;
      }
      store[key] = { type, id, title: meta.title || '', poster: meta.poster || '', kind: meta.kind || '', added: Date.now() };
      const entries = Object.values(store).sort((a, b) => b.added - a.added).slice(0, MAX_MYLIST_ITEMS);
      const capped = {};
      entries.forEach((en) => { capped[myListKey(en.type, en.id)] = en; });
      try { localStorage.setItem(MYLIST_KEY, JSON.stringify(capped)); } catch (e) {}
      return true;
    }
    function getMyListItems() {
      return Object.values(readMyListStore()).sort((a, b) => b.added - a.added);
    }

    // Telegram Mini App initialization
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Elements
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const mediaGrid = document.getElementById('mediaGrid');
    const sectionTitle = document.getElementById('sectionTitle');
    const itemsCount = document.getElementById('itemsCount');
    const mediaModal = document.getElementById('mediaModal');
    const closeModal = document.getElementById('closeModal');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // Modal elements
    const modalPoster = document.getElementById('modalPoster');
    const modalTitle = document.getElementById('modalTitle');
    const modalRating = document.getElementById('modalRating');
    const modalYear = document.getElementById('modalYear');
    const modalKind = document.getElementById('modalKind');
    const modalStory = document.getElementById('modalStory');
    const seriesControls = document.getElementById('seriesControls');
    const seasonSelect = document.getElementById('seasonSelect');
    const episodesGrid = document.getElementById('episodesGrid');
    const playerContainer = document.getElementById('playerContainer');
    const videoIframe = document.getElementById('videoIframe');
    const videoNative = document.getElementById('videoNative');
    const playerStatus = document.getElementById('playerStatus');
    const btnPlayInApp = document.getElementById('btnPlayInApp');
    const btnDirectDownload = document.getElementById('btnDirectDownload');
    const btnOpenInBot = document.getElementById('btnOpenInBot');

    // Home: most-watched first, then top-rated, with year filter chips.
    // The grid view (search / discover / filters) hides these sections.
    let homeData = null; // { mostWatched, topRated }
    let homeYearFilter = 'all';

    function showGridView() {
      document.getElementById('homeSections').classList.add('hidden');
      document.getElementById('gridHeader').classList.remove('hidden');
      mediaGrid.classList.remove('hidden');
    }

    function showHomeView() {
      mediaGrid.classList.add('hidden');
      document.getElementById('gridHeader').classList.add('hidden');
      document.getElementById('homeSections').classList.remove('hidden');
    }

    async function loadHome() {
      showHomeView();
      const sectionsEl = document.getElementById('homeSections');
      sectionsEl.innerHTML = '<div class="animate-pulse bg-brand-card rounded-2xl h-64 border border-brand-border"></div>';
      try {
        const [homeRes, airingRes, upcomingRes] = await Promise.all([
          fetch(`${API_BASE}/api/home`),
          fetch(`${TMDB_BASE}/tv/airing_today?api_key=${TMDB_KEY}&language=ar`).catch(() => null),
          fetch(`${TMDB_BASE}/movie/upcoming?api_key=${TMDB_KEY}&language=ar`).catch(() => null),
        ]);
        const data = await homeRes.json();
        // New episodes + coming soon (stage H): TMDB direct, each
        // failure degrades to an empty row instead of breaking home.
        const airing = airingRes ? await airingRes.json().catch(() => null) : null;
        const upcoming = upcomingRes ? await upcomingRes.json().catch(() => null) : null;
        homeData = {
          mostWatched: data.mostWatched || [],
          topRated: data.topRated || [],
          newEpisodes: ((airing?.results || []).slice(0, 20)).map((i) => ({ ...i, media_type: 'tv' })),
          upcoming: ((upcoming?.results || []).slice(0, 20)).map((i) => ({ ...i, media_type: 'movie' })),
        };
        homeYearFilter = 'all';
        renderHomeSections();
      } catch (e) {
        sectionsEl.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm font-semibold">تعذر جلب البيانات. يرجى التحقق من اتصالك.</div>`;
      }
    }

    function homeYearOf(item) {
      const date = item.release_date || item.first_air_date || '';
      return date ? Number(date.slice(0, 4)) : null;
    }

    function filterHomeList(items) {
      if (homeYearFilter === 'all') return items;
      if (homeYearFilter === 'older') {
        return items.filter((i) => { const y = homeYearOf(i); return y && y <= 2022; });
      }
      const year = Number(homeYearFilter);
      return items.filter((i) => homeYearOf(i) === year);
    }

    function renderHomeSections() {
      const sectionsEl = document.getElementById('homeSections');
      if (!homeData) return;
      const years = [
        { value: 'all', label: 'الكل' },
        { value: '2026', label: '2026' },
        { value: '2025', label: '2025' },
        { value: '2024', label: '2024' },
        { value: '2023', label: '2023' },
        { value: 'older', label: 'أقدم' },
      ];
      const chips = years.map((y) => `
        <button data-year="${y.value}" class="home-year-chip whitespace-nowrap px-4 py-2 rounded-xl border transition text-xs font-bold ${homeYearFilter === y.value ? 'bg-red-600 border-red-600 text-white' : 'bg-brand-card border-brand-border text-slate-300 hover:border-slate-500'}">${y.label}</button>
      `).join('');
      const mostWatched = filterHomeList(homeData.mostWatched);
      const topRated = filterHomeList(homeData.topRated);
      const emptyNote = (!mostWatched.length && !topRated.length)
        ? '<div class="text-center py-12 text-slate-400 text-sm font-bold">لا توجد أعمال في هذه السنة.</div>'
        : '';
      sectionsEl.innerHTML = `
        ${continueSectionHtml(getContinueItems())}
        ${myListSectionHtml(getMyListItems())}
        <div class="flex flex-wrap gap-2 items-center">
          <span class="text-xs font-bold text-slate-400">السنة:</span>
          ${chips}
        </div>
        ${homeSectionHtml('🔥 الأكثر مشاهدة', mostWatched)}
        ${homeSectionHtml('⭐ الأعلى تقييمًا', topRated)}
        ${homeSectionHtml('🆕 حلقات جديدة', homeData.newEpisodes || [])}
        ${homeSectionHtml('📅 قريبًا', homeData.upcoming || [])}
        ${emptyNote}
      `;
      sectionsEl.querySelectorAll('.home-year-chip').forEach((btn) => {
        btn.addEventListener('click', () => {
          homeYearFilter = btn.dataset.year;
          renderHomeSections();
        });
      });
    }

    function homeSectionHtml(title, items) {
      if (!items.length) return '';
      return `
        <section>
          <h3 class="text-base font-extrabold text-white mb-3">${title}</h3>
          <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
            ${items.map(homeCardHtml).join('')}
          </div>
        </section>
      `;
    }

    function homeCardHtml(item) {
      const title = item.title || item.name || 'بدون عنوان';
      const date = item.release_date || item.first_air_date || '';
      const year = date ? date.slice(0, 4) : '';
      const rating = item.vote_average ? item.vote_average.toFixed(1) : '7.5';
      const poster = item.poster_path ? `${IMG_BASE}${item.poster_path}` : 'https://placehold.co/300x450/161e2e/94a3b8?text=No+Poster';
      const kind = item.media_type === 'tv' ? 'مسلسل' : 'فيلم';
      return `
        <div class="group cursor-pointer shrink-0 w-36 sm:w-40 bg-brand-card rounded-2xl overflow-hidden border border-brand-border hover:border-red-500/60 transition-all duration-200 shadow-lg" onclick="openDetails(${item.id}, '${item.media_type || (item.name ? 'tv' : 'movie')}')">
          <div class="relative aspect-[2/3] bg-slate-900 overflow-hidden">
            <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
            <span class="absolute top-2 right-2 px-2 py-0.5 rounded-lg bg-black/75 backdrop-blur-md text-amber-400 text-[11px] font-extrabold border border-amber-500/20">⭐ ${rating}</span>
            <span class="absolute top-2 left-2 px-2 py-0.5 rounded-lg bg-black/75 backdrop-blur-md text-slate-300 text-[10px] font-bold border border-white/10">${kind}</span>
          </div>
          <div class="p-2.5">
            <h4 class="text-xs font-bold text-white truncate">${title}</h4>
            <div class="flex items-center justify-between mt-1 text-[11px] text-slate-400 font-medium">
              <span>${year}</span>
              <span class="text-red-400 font-semibold group-hover:underline">عرض ◀</span>
            </div>
          </div>
        </div>
      `;
    }

    // Continue watching row (stage A): personal, so it is NOT filtered
    // by the year chips. Cards carry a progress bar and "أكمل من M:SS";
    // tapping one opens the title at the saved season/episode and plays
    // from the saved position.
    function continueSectionHtml(items) {
      if (!items.length) return '';
      return `
        <section>
          <h3 class="text-base font-extrabold text-white mb-3">▶ أكمل المشاهدة</h3>
          <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
            ${items.map(continueCardHtml).join('')}
          </div>
        </section>
      `;
    }

    function continueCardHtml(entry) {
      const pct = entry.d > 0 ? Math.min(100, Math.round((entry.t / entry.d) * 100)) : 0;
      const poster = entry.poster || 'https://placehold.co/300x450/161e2e/94a3b8?text=No+Poster';
      const epLabel = entry.type === 'tv' ? ` • حلقة ${entry.e}` : '';
      const title = (entry.title || 'بدون عنوان').replace(/"/g, '&quot;');
      return `
        <div class="group cursor-pointer shrink-0 w-36 sm:w-40 bg-brand-card rounded-2xl overflow-hidden border border-brand-border hover:border-red-500/60 transition-all duration-200 shadow-lg" onclick="openContinueEntry('${entry.type}', ${entry.id}, ${entry.s}, ${entry.e})">
          <div class="relative aspect-[2/3] bg-slate-900 overflow-hidden">
            <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
            <span class="absolute bottom-0 right-0 left-0 h-1.5 bg-black/60"><span class="block h-full bg-red-600" style="width:${pct}%"></span></span>
          </div>
          <div class="p-2.5">
            <h4 class="text-xs font-bold text-white truncate">${title}${epLabel}</h4>
            <div class="flex items-center justify-between mt-1 text-[11px] text-slate-400 font-medium">
              <span>أكمل من ${formatTime(entry.t)}</span>
            </div>
          </div>
        </div>
      `;
    }

    async function openContinueEntry(type, id, s, e) {
      await openDetails(id, type);
      if (type === 'tv' && currentItem) {
        const seasons = (currentItem.seasons || []).filter((x) => x.season_number > 0);
        if (seasons.some((x) => x.season_number === s)) {
          selectedSeason = s;
          seasonSelect.value = String(s);
          const season = seasons.find((x) => x.season_number === s);
          renderEpisodes(season?.episode_count || 10);
        }
        selectedEpisode = e;
        document.querySelectorAll('.ep-btn').forEach((b, i) => {
          const on = i + 1 === e;
          b.classList.toggle('bg-red-600', on);
          b.classList.toggle('text-white', on);
          b.classList.toggle('bg-slate-800', !on);
          b.classList.toggle('text-slate-300', !on);
        });
        updateResumeButton();
      }
      const entry = currentResumeEntry();
      pendingResume = entry ? entry.t : null;
      playActiveStream();
    }

    // My list row (stage B): tapping a card opens its details.
    function myListSectionHtml(items) {
      if (!items.length) return '';
      return `
        <section>
          <h3 class="text-base font-extrabold text-white mb-3">❤️ قائمتي</h3>
          <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
            ${items.map(myListCardHtml).join('')}
          </div>
        </section>
      `;
    }

    function myListCardHtml(entry) {
      const poster = entry.poster || 'https://placehold.co/300x450/161e2e/94a3b8?text=No+Poster';
      const title = (entry.title || 'بدون عنوان').replace(/"/g, '&quot;');
      return `
        <div class="group cursor-pointer shrink-0 w-36 sm:w-40 bg-brand-card rounded-2xl overflow-hidden border border-brand-border hover:border-red-500/60 transition-all duration-200 shadow-lg" onclick="openDetails(${entry.id}, '${entry.type}')">
          <div class="relative aspect-[2/3] bg-slate-900 overflow-hidden">
            <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
          </div>
          <div class="p-2.5">
            <h4 class="text-xs font-bold text-white truncate">${title}</h4>
            <div class="flex items-center justify-between mt-1 text-[11px] text-slate-400 font-medium">
              <span>${entry.type === 'tv' ? 'مسلسل' : 'فيلم'}</span>
              <span class="text-red-400 font-semibold group-hover:underline">عرض ◀</span>
            </div>
          </div>
        </div>
      `;
    }

    // The My list button in the details modal: toggles the current title.
    function updateMyListButton() {
      const btn = document.getElementById('btnMyList');
      if (!btn || !currentItem) return;
      const type = currentItem.media_type === 'tv' ? 'tv' : 'movie';
      btn.innerHTML = isInMyList(type, currentItem.id) ? '❤️ في قائمتي — إزالة' : '🤍 أضف لقائمتي';
    }

    // Search suggestions + recent searches (stage E): as the user types,
    // the top 6 live results appear under the search box; tapping one
    // opens its details. Focusing an empty box shows recent searches
    // (localStorage, newest first, max 8).
    const RECENT_SEARCHES_KEY = 'filmaty:recent-searches:v1';
    const searchSuggest = document.getElementById('searchSuggest');
    let suggestTimer = null;
    let suggestSeq = 0;
    function readRecentSearches() {
      try { return JSON.parse(localStorage.getItem(RECENT_SEARCHES_KEY) || '[]'); } catch (e) { return []; }
    }
    function saveRecentSearch(q) {
      q = q.trim();
      if (!q) return;
      const list = readRecentSearches().filter((x) => x !== q);
      list.unshift(q);
      try { localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(list.slice(0, 8))); } catch (e) {}
    }
    function hideSuggest() {
      searchSuggest.classList.add('hidden');
      searchSuggest.innerHTML = '';
    }
    function renderSuggestItems(items, isRecent) {
      if (!items.length) { hideSuggest(); return; }
      const title = isRecent ? '🕘 بحثات أخيرة' : '💡 اقتراحات';
      searchSuggest.innerHTML = `
        <p class="px-4 pt-3 pb-1 text-[11px] font-extrabold text-slate-400">${title}</p>
        ${items.map((it) => {
          if (isRecent) {
            const q = String(it).replace(/"/g, '&quot;');
            return `<button class="suggest-item w-full text-right px-4 py-2.5 text-sm font-bold text-white hover:bg-slate-800 transition flex items-center gap-2" data-query="${q}"><span>🕘</span><span class="truncate">${q}</span></button>`;
          }
          const name = (it.title || it.name || 'بدون عنوان').replace(/"/g, '&quot;');
          const date = it.release_date || it.first_air_date || '';
          const year = date ? date.slice(0, 4) : '';
          const kind = (it.media_type || (it.name ? 'tv' : 'movie')) === 'tv' ? 'مسلسل' : 'فيلم';
          return `<button class="suggest-item w-full text-right px-4 py-2.5 text-sm font-bold text-white hover:bg-slate-800 transition flex items-center justify-between gap-2" data-id="${it.id}" data-type="${it.media_type || (it.name ? 'tv' : 'movie')}"><span class="truncate">${name}</span><span class="text-[11px] text-slate-400 shrink-0">${kind} ${year}</span></button>`;
        }).join('')}
      `;
      searchSuggest.classList.remove('hidden');
      searchSuggest.querySelectorAll('.suggest-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          hideSuggest();
          if (btn.dataset.query) {
            searchInput.value = btn.dataset.query;
            clearSearch.classList.remove('hidden');
            executeSearch(btn.dataset.query);
            return;
          }
          openDetails(Number(btn.dataset.id), btn.dataset.type);
        });
      });
    }
    async function fetchSuggest(q) {
      const seq = ++suggestSeq;
      try {
        const res = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (seq !== suggestSeq) return;
        if (searchInput.value.trim() !== q) return;
        renderSuggestItems((data.results || []).filter((i) => !i.providerUrl).slice(0, 6), false);
      } catch (e) {}
    }
    searchInput.addEventListener('focus', () => {
      if (!searchInput.value.trim()) renderSuggestItems(readRecentSearches(), true);
    });
    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideSuggest(); });
    document.addEventListener('click', (e) => {
      if (!searchSuggest.contains(e.target) && e.target !== searchInput) hideSuggest();
    });

    // Search function with Debounce
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      clearSearch.classList.toggle('hidden', !q);
      clearTimeout(debounceTimer);
      clearTimeout(suggestTimer);
      if (!q) {
        loadHome();
        hideSuggest();
        return;
      }
      suggestTimer = setTimeout(() => fetchSuggest(q), 250);
      debounceTimer = setTimeout(() => executeSearch(q), 350);
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      clearSearch.classList.add('hidden');
      hideSuggest();
      loadHome();
    });

    // Search via the Worker: TMDB in Arabic + English merged, with a
    // provider fallback when TMDB returns nothing.
    async function executeSearch(query) {
      saveRecentSearch(query);
      hideSuggest();
      renderLoading();
      try {
        const res = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        renderCards(data.results || [], `🔍 نتائج البحث عن: "${query}"`);
      } catch (e) {
        showError('تعذر إتمام البحث. حاول مرة أخرى.');
      }
    }

    // Side drawer (hamburger menu). Slides in from the right (RTL start
    // side); the overlay or the ✕ button closes it. Full-height and
    // scrollable so it works on a 390px phone.
    const menuBtn = document.getElementById('menuBtn');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerClose = document.getElementById('drawerClose');

    function openDrawer() {
      sideDrawer.classList.remove('translate-x-full');
      drawerOverlay.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    }

    function closeDrawer() {
      sideDrawer.classList.add('translate-x-full');
      drawerOverlay.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    menuBtn.addEventListener('click', openDrawer);
    drawerClose.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // Expandable drawer groups (movies / series language lists, and the
    // nested «لغات أخرى» sub-groups inside each). The button's
    // data-group names the sub-list: drawer-<group>.
    document.querySelectorAll('.drawer-group-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const sub = document.getElementById(`drawer-${btn.dataset.group}`);
        const arrow = btn.querySelector('.drawer-arrow');
        const opening = sub.classList.contains('hidden');
        sub.classList.toggle('hidden');
        if (arrow) arrow.textContent = opening ? '▴' : '▾';
      });
    });

    // Language names for browse titles: «🎬 أفلام عربية», «📺 مسلسلات هندية».
    const LANG_LABELS = {
      ar: 'عربية', en: 'إنجليزية', hi: 'هندية', tr: 'تركية',
      ko: 'كورية', es: 'إسبانية', fr: 'فرنسية', ja: 'يابانية',
    };

    // Browse via the Worker (/api/browse) — all browsing goes through the
    // backend now; the old direct-browser TMDB discover calls are gone.
    async function loadBrowse(params, title) {
      renderLoading();
      try {
        const qs = new URLSearchParams(params);
        const res = await fetch(`${API_BASE}/api/browse?${qs.toString()}`);
        const data = await res.json();
        renderCards(data.results || [], title);
      } catch (e) {
        showError('تعذر جلب البيانات.');
      }
    }

    // English (American) browses with lang=en + origin=US so the list
    // is US-origin English content, not every English-language title.
    function loadBrowseLanguage(type, lang, origin) {
      const kind = type === 'tv' ? '📺 مسلسلات' : '🎬 أفلام';
      const params = { type, lang, sort: 'popular', page: '1' };
      if (origin) params.origin = origin;
      loadBrowse(
        params,
        `${kind} ${LANG_LABELS[lang] || lang}${origin ? ' (أمريكية)' : ''}`,
      );
    }

    // Top-rated: top-rated movies + top-rated series, one grid merged by
    // vote_average desc.
    async function loadTopRated() {
      renderLoading();
      try {
        const [movies, tv] = await Promise.all([
          fetch(`${API_BASE}/api/browse?type=movie&sort=top_rated&page=1`).then((r) => r.json()),
          fetch(`${API_BASE}/api/browse?type=tv&sort=top_rated&page=1`).then((r) => r.json()),
        ]);
        const merged = [...(movies.results || []), ...(tv.results || [])]
          .sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));
        renderCards(merged, '⭐ الأعلى تقييمًا');
      } catch (e) {
        showError('تعذر جلب البيانات.');
      }
    }

    function clearActiveFilters() {
      filterBtns.forEach((b) => {
        b.classList.remove('bg-red-600', 'text-white');
        b.classList.add('bg-brand-card', 'text-slate-300');
      });
    }

    // Drawer language items.
    document.querySelectorAll('.drawer-lang').forEach((btn) => {
      btn.addEventListener('click', () => {
        clearActiveFilters();
        closeDrawer();
        loadBrowseLanguage(btn.dataset.type, btn.dataset.lang, btn.dataset.origin);
      });
    });

    document.getElementById('drawerTopRated').addEventListener('click', () => {
      clearActiveFilters();
      closeDrawer();
      loadTopRated();
    });
    document.getElementById('drawerMarvel').addEventListener('click', () => {
      clearActiveFilters();
      closeDrawer();
      loadBrowse({ type: 'movie', collection: 'marvel', sort: 'popular', page: '1' }, '🦸‍♂️ مارفل');
    });
    document.getElementById('drawerNetflix').addEventListener('click', () => {
      clearActiveFilters();
      closeDrawer();
      loadBrowse({ type: 'movie', collection: 'netflix', sort: 'popular', page: '1' }, '🔴 نتفليكس');
    });

    // Category filter click handler: each tab has its own home.
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.classList.remove('bg-red-600', 'text-white');
          b.classList.add('bg-brand-card', 'text-slate-300');
        });
        btn.classList.remove('bg-brand-card', 'text-slate-300');
        btn.classList.add('bg-red-600', 'text-white');

        const filter = btn.dataset.filter;
        searchInput.value = '';
        clearSearch.classList.add('hidden');

        if (filter === 'trending') loadHome();
        else if (filter === 'movie') loadBrowse({ type: 'movie', sort: 'popular', page: '1' }, '🎬 أحدث الأفلام');
        else if (filter === 'tv') loadBrowse({ type: 'tv', sort: 'popular', page: '1' }, '📺 أحدث المسلسلات');
        else if (filter === 'marvel') loadBrowse({ type: 'movie', collection: 'marvel', sort: 'popular', page: '1' }, '🦸‍♂️ مارفل');
        else if (filter === 'netflix') loadBrowse({ type: 'movie', collection: 'netflix', sort: 'popular', page: '1' }, '🔴 نتفليكس');
      });
    });

    function renderLoading() {
      showGridView();
      mediaGrid.innerHTML = Array(10).fill(0).map(() => `
        <div class="animate-pulse bg-brand-card rounded-2xl h-64 border border-brand-border"></div>
      `).join('');
    }

    function showError(msg) {
      showGridView();
      mediaGrid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm font-semibold">${msg}</div>`;
    }

    function renderCards(items, title) {
      sectionTitle.innerHTML = title;
      itemsCount.innerText = `${items.length} عمل`;

      if (!items.length) {
        mediaGrid.innerHTML = `
          <div class="col-span-full text-center py-16 text-slate-400">
            <p class="text-3xl mb-2">🍿</p>
            <p class="text-sm font-bold">لم يتم العثور على نتائج مطابقة.</p>
          </div>`;
        return;
      }

      mediaGrid.innerHTML = items.map(item => {
        const title = item.title || item.name || 'بدون عنوان';
        const date = item.release_date || item.first_air_date || '';
        const year = date ? date.slice(0, 4) : '';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : '7.5';
        // Provider-only entries carry a full poster URL and a provider link
        // (no TMDB id): prefer the full URL, and open the provider page.
        const poster = item.poster || (item.poster_path ? `${IMG_BASE}${item.poster_path}` : 'https://placehold.co/300x450/161e2e/94a3b8?text=No+Poster');
        const kind = item.media_type === 'tv' ? 'مسلسل' : 'فيلم';
        const click = item.providerUrl
          ? `window.open('${item.providerUrl}', '_blank')`
          : `openDetails(${item.id}, '${item.media_type || (item.name ? 'tv' : 'movie')}')`;
        const action = item.provider
          ? `<span class="text-blue-400 font-semibold">${item.provider} ↗</span>`
          : '<span class="text-red-400 font-semibold group-hover:underline">عرض ◀</span>';

        return `
          <div class="group cursor-pointer bg-brand-card rounded-2xl overflow-hidden border border-brand-border hover:border-red-500/60 transition-all duration-200 hover:-translate-y-1 shadow-lg" onclick="${click}">
            <div class="relative aspect-[2/3] bg-slate-900 overflow-hidden">
              <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
              <span class="absolute top-2 right-2 px-2 py-0.5 rounded-lg bg-black/75 backdrop-blur-md text-amber-400 text-[11px] font-extrabold border border-amber-500/20">⭐ ${rating}</span>
              <span class="absolute top-2 left-2 px-2 py-0.5 rounded-lg bg-black/75 backdrop-blur-md text-slate-300 text-[10px] font-bold border border-white/10">${kind}</span>
            </div>
            <div class="p-2.5">
              <h4 class="text-xs font-bold text-white truncate">${title}</h4>
              <div class="flex items-center justify-between mt-1 text-[11px] text-slate-400 font-medium">
                <span>${year}</span>
                ${action}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Modal Details Logic
    async function openDetails(id, mediaType) {
      try {
        const res = await fetch(`${TMDB_BASE}/${mediaType}/${id}?api_key=${TMDB_KEY}&language=ar`);
        currentItem = await res.json();
        currentItem.media_type = mediaType;

        const title = currentItem.title || currentItem.name;
        const date = currentItem.release_date || currentItem.first_air_date || '';
        const year = date ? date.slice(0, 4) : '';
        const rating = currentItem.vote_average ? currentItem.vote_average.toFixed(1) : '8.0';
        const poster = currentItem.poster_path ? `${IMG_BASE}${currentItem.poster_path}` : 'https://placehold.co/300x450/161e2e/94a3b8?text=Poster';

        modalTitle.innerText = title;
        modalPoster.src = poster;
        modalRating.innerText = `⭐ ${rating}`;
        modalYear.innerText = year;
        modalKind.innerText = mediaType === 'tv' ? 'مسلسل' : 'فيلم';
        modalStory.innerText = currentItem.overview || 'لا يتوفر وصف مختصر لهذا العمل حالياً.';

        // Player reset
        resetPlayer();
        playerContainer.classList.add('hidden');

        if (mediaType === 'tv') {
          seriesControls.classList.remove('hidden');
          setupSeriesSeasons(currentItem);
        } else {
          seriesControls.classList.add('hidden');
          selectedSeason = 1;
          selectedEpisode = 1;
        }
        document.getElementById('btnDownloadSeason').classList.toggle('hidden', mediaType !== 'tv');
        document.getElementById('seasonDownloadPicker').classList.add('hidden');
        document.getElementById('seasonDownloadProgress').classList.add('hidden');

        mediaModal.classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
        updateResumeButton();
        updateMyListButton();
        loadTrailerAndSimilar(id, mediaType);
      } catch (err) {
        alert('تعذر فتح تفاصيل العمل.');
      }
    }

    // Trailer + similar titles (stage D): fetched from TMDB after the
    // details open. The trailer plays in the same iframe (YouTube is
    // trusted, so no sandbox — embedwave re-adds its sandbox on play).
    // A sequence guard drops stale responses when the user opens
    // another title before the fetch lands.
    let trailerKey = null;
    let trailerLoadSeq = 0;
    async function loadTrailerAndSimilar(id, mediaType) {
      const loadId = ++trailerLoadSeq;
      trailerKey = null;
      const btn = document.getElementById('btnTrailer');
      const wrap = document.getElementById('similarWrap');
      const row = document.getElementById('similarRow');
      btn.classList.add('hidden');
      wrap.classList.add('hidden');
      row.innerHTML = '';
      try {
        const [videosRes, similarRes] = await Promise.all([
          fetch(`${TMDB_BASE}/${mediaType}/${id}/videos?api_key=${TMDB_KEY}&language=en-US`),
          fetch(`${TMDB_BASE}/${mediaType}/${id}/similar?api_key=${TMDB_KEY}&language=ar`),
        ]);
        if (loadId !== trailerLoadSeq) return;
        const videos = await videosRes.json().catch(() => null);
        const trailer = (videos?.results || []).find((v) => v.site === 'YouTube' && v.type === 'Trailer');
        if (trailer) { trailerKey = trailer.key; btn.classList.remove('hidden'); }
        const similar = await similarRes.json().catch(() => null);
        const items = (similar?.results || []).slice(0, 10);
        if (items.length) {
          row.innerHTML = items.map(homeCardHtml).join('');
          wrap.classList.remove('hidden');
        }
      } catch (e) {}
    }

    function setupSeriesSeasons(tv) {
      const seasons = (tv.seasons || []).filter(s => s.season_number > 0);
      seasonSelect.innerHTML = seasons.map(s => `
        <option value="${s.season_number}">الموسم ${s.season_number} (${s.episode_count} حلقة)</option>
      `).join('');

      selectedSeason = seasons[0]?.season_number || 1;
      renderEpisodes(seasons[0]?.episode_count || 10);

      seasonSelect.onchange = (e) => {
        selectedSeason = Number(e.target.value);
        const s = seasons.find(x => x.season_number === selectedSeason);
        renderEpisodes(s?.episode_count || 10);
      };
    }

    function renderEpisodes(count) {
      selectedEpisode = 1;
      currentSeasonEpisodeCount = count;
      episodesGrid.innerHTML = Array.from({ length: count }, (_, i) => i + 1).map(epNum => {
        const watched = currentItem && isWatched('tv', currentItem.id, selectedSeason, epNum);
        const prog = currentItem ? getProgress('tv', currentItem.id, selectedSeason, epNum) : null;
        const pct = prog && prog.d > 0 ? Math.min(100, Math.round((prog.t / prog.d) * 100)) : 0;
        return `
        <button class="ep-btn relative overflow-hidden ${epNum === 1 ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300'} rounded-xl py-1.5 text-xs font-bold border border-brand-border hover:bg-red-600 hover:text-white transition" onclick="selectEpisode(${epNum}, this)">
          ${watched ? '✓ ' : ''}حلقة ${epNum}
          ${pct > 0 ? `<span class="absolute bottom-0 right-0 h-1 bg-emerald-400" style="width:${pct}%"></span>` : ''}
        </button>
      `; }).join('');
      updateResumeButton();
    }

    function selectEpisode(epNum, btn) {
      selectedEpisode = epNum;
      clearAutoNext();
      document.querySelectorAll('.ep-btn').forEach(b => {
        b.classList.remove('bg-red-600', 'text-white');
        b.classList.add('bg-slate-800', 'text-slate-300');
      });
      btn.classList.remove('bg-slate-800', 'text-slate-300');
      btn.classList.add('bg-red-600', 'text-white');
      updateResumeButton();

      // Update active stream player if already open
      if (!playerContainer.classList.contains('hidden')) {
        const entry = currentResumeEntry();
        pendingResume = entry ? entry.t : null;
        playActiveStream();
      }
    }

    function resolveKey(type, id, s, e) {
      return `${type}:${id}:${s || 0}:${e || 0}`;
    }

    // Ask the Worker for the servers/qualities of a title. 12s timeout;
    // null on network failure or timeout. A parsed body is returned even
    // when ok:false (it still carries the embedwave server); the caller
    // decides whether to play natively or fall back to embedwave.
    async function fetchResolve(type, id, s, e) {
      const params = new URLSearchParams({ type, id: String(id) });
      if (s) params.set('s', String(s));
      if (e) params.set('e', String(e));
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      try {
        const res = await fetch(`${API_BASE}/api/resolve?${params.toString()}`, { signal: controller.signal });
        const data = await res.json().catch(() => null);
        return data || null;
      } catch (err) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    function showPlayerStatus(msg) {
      playerStatus.innerText = msg;
      playerStatus.classList.remove('hidden');
    }

    function hidePlayerStatus() {
      playerStatus.classList.add('hidden');
    }

    function resetPlayer() {
      trackProgress(true);
      clearAutoNext();
      nativeActive = false;
      clearNativePlayTimeout();
      videoNative.pause();
      videoNative.removeAttribute('src');
      videoNative.load();
      videoNative.classList.add('hidden');
      videoIframe.src = '';
      videoIframe.classList.remove('hidden');
      hidePlayerStatus();
    }

    // Native-player failure handling: a dead stream (e.g. the CDN host is
    // down) must fall back to the sandboxed embedwave iframe instead of
    // leaving a broken black player — and the dead link must not be
    // reused by the download button.
    let nativeActive = false;
    let nativePlayTimer = null;

    function clearNativePlayTimeout() {
      if (nativePlayTimer) { clearTimeout(nativePlayTimer); nativePlayTimer = null; }
    }

    function armNativePlayTimeout() {
      clearNativePlayTimeout();
      nativePlayTimer = setTimeout(() => {
        if (!nativeActive) return;
        // 45s with no playable data: the stream is dead, not just slow.
        // The CDN can take well over 15s to deliver the first bytes on a
        // cold start (verified live: Interstellar 1080p needed over 15s
        // before readyState 2, then played fine) — a 15s timeout kept
        // declaring healthy streams dead and cycling away from them.
        if (videoNative.readyState < 2) {
          showPlayerStatus('⚠️ المصدر المباشر مش شغال — جاري التبديل لمشغّل بديل...');
          tryNextQualityOrFallback();
        }
      }, 45000);
    }

    videoNative.addEventListener('error', () => {
      if (!nativeActive) return;
      showPlayerStatus('⚠️ المصدر المباشر مش شغال — جاري تجربة مصدر آخر...');
      tryNextQualityOrFallback();
    });
    videoNative.addEventListener('playing', clearNativePlayTimeout);

    // Continue watching: save the position while playing (throttled to
    // every 5s), on pause, and when the page hides; mark watched at the
    // end (or past 90%). pendingResume is consumed once by the
    // loadedmetadata listener — quality/server switches never re-seek.
    let lastProgressSave = 0;
    let pendingResume = null; // seconds to seek to once metadata loads
    function currentProgressMeta() {
      if (!currentItem) return null;
      const type = currentItem.media_type === 'tv' ? 'tv' : 'movie';
      return { type, s: type === 'tv' ? selectedSeason : 0, e: type === 'tv' ? selectedEpisode : 0, title: currentItem.title || currentItem.name || '', poster: currentItem.poster_path ? `${IMG_BASE}${currentItem.poster_path}` : '', kind: type };
    }
    function trackProgress(force) {
      const meta = currentProgressMeta();
      if (!meta || !nativeActive) return;
      const t = videoNative.currentTime;
      const d = videoNative.duration;
      if (!Number.isFinite(t) || t < 5) return;
      const now = Date.now();
      if (!force && now - lastProgressSave < 5000) return;
      lastProgressSave = now;
      if (Number.isFinite(d) && d > 0 && t >= d - 30) { markWatchedEntry(meta.type, currentItem.id, meta.s, meta.e); updateResumeButton(); return; }
      saveProgressEntry(meta.type, currentItem.id, meta.s, meta.e, t, d, meta);
    }
    videoNative.addEventListener('timeupdate', () => trackProgress(false));
    videoNative.addEventListener('pause', () => trackProgress(true));
    videoNative.addEventListener('ended', () => {
      const meta = currentProgressMeta();
      if (meta) markWatchedEntry(meta.type, currentItem.id, meta.s, meta.e);
      updateResumeButton();
      armAutoNext();
    });
    document.addEventListener('pagehide', () => trackProgress(true));
    videoNative.addEventListener('loadedmetadata', () => {
      if (pendingResume != null && Number.isFinite(videoNative.duration) && videoNative.duration > 0) {
        videoNative.currentTime = Math.min(pendingResume, Math.max(0, videoNative.duration - 10));
        pendingResume = null;
      }
    });

    // The Play button shows "أكمل من M:SS" when a saved position exists
    // for this title/episode; the restart button appears alongside it.
    function currentResumeEntry() {
      if (!currentItem) return null;
      const type = currentItem.media_type === 'tv' ? 'tv' : 'movie';
      return getProgress(type, currentItem.id, type === 'tv' ? selectedSeason : 0, type === 'tv' ? selectedEpisode : 0);
    }
    function updateResumeButton() {
      const label = document.getElementById('btnPlayInAppLabel');
      const restart = document.getElementById('btnRestartPlay');
      if (!label || !restart) return;
      const entry = currentResumeEntry();
      label.innerText = entry ? `أكمل من ${formatTime(entry.t)}` : 'مشاهدة فورية';
      restart.classList.toggle('hidden', !entry);
    }

    // Auto-next episode (stage C): when a series episode ends on the
    // native player, the next episode starts after a 5s countdown the
    // user can cancel or skip. Embedwave cannot report "ended", so it
    // never auto-advances.
    let autoNextTimer = null;
    let autoNextEpisode = null;
    let currentSeasonEpisodeCount = 10;
    function clearAutoNext() {
      if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
      autoNextEpisode = null;
      const bar = document.getElementById('autoNextBar');
      if (bar) { bar.classList.add('hidden'); bar.classList.remove('flex'); }
    }
    function armAutoNext() {
      clearAutoNext();
      if (!currentItem || currentItem.media_type !== 'tv') return;
      if (!nativeActive) return;
      if (selectedEpisode >= currentSeasonEpisodeCount) return;
      autoNextEpisode = selectedEpisode + 1;
      let left = 5;
      const bar = document.getElementById('autoNextBar');
      const text = document.getElementById('autoNextText');
      bar.classList.remove('hidden');
      bar.classList.add('flex');
      const tick = () => {
        if (left <= 0) {
          const nextBtn = document.querySelectorAll('.ep-btn')[autoNextEpisode - 1];
          clearAutoNext();
          if (nextBtn) nextBtn.click();
          return;
        }
        text.innerText = `الحلقة التالية (حلقة ${autoNextEpisode}) خلال ${left} ثواني…`;
        left--;
        autoNextTimer = setTimeout(tick, 1000);
      };
      tick();
    }

    // Server + quality selection. currentServers is the servers array from
    // the last /api/resolve (native server first, embedwave last).
    function selectedServer() {
      return currentServers ? currentServers[selectedServerIdx] : null;
    }

    function selectedQuality() {
      const server = selectedServer();
      return server ? server.qualities[selectedQualityIdx] : null;
    }

    function isEmbedwaveServer(server) {
      return server && server.name === 'embedwave';
    }

    // The iframe embed server (embedwave), as opposed to a native
    // direct-stream server.
    function isEmbedServer(server) {
      return isEmbedwaveServer(server);
    }

    // Sandbox flags for the embedwave iframe: scripts + same-origin so the
    // player can run, but NO allow-popups / allow-top-navigation, so its
    // ads cannot open tabs or hijack the page.
    const EMBEDWAVE_SANDBOX = 'allow-same-origin allow-scripts allow-presentation allow-forms';

    function renderServerControls() {
      const wrap = document.getElementById('serverControls');
      const serversRow = document.getElementById('serversRow');
      const qualitiesRow = document.getElementById('qualitiesRow');
      const qualityWrap = document.getElementById('qualityWrap');
      if (!currentServers || currentServers.length === 0) {
        wrap.classList.add('hidden');
        return;
      }
      wrap.classList.remove('hidden');
      serversRow.innerHTML = '';
      currentServers.forEach((server, idx) => {
        const b = document.createElement('button');
        b.className = 'px-3 py-1.5 rounded-lg text-xs font-bold border transition ' + (idx === selectedServerIdx
          ? 'bg-red-600 border-red-600 text-white'
          : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-red-500');
        b.textContent = server.name;
        b.addEventListener('click', () => {
          selectedServerIdx = idx;
          selectedQualityIdx = 0;
          renderServerControls();
          playSelected();
        });
        serversRow.appendChild(b);
      });
      const server = selectedServer();
      qualitiesRow.innerHTML = '';
      if (server && server.qualities.length > 1) {
        qualityWrap.classList.remove('hidden');
        server.qualities.forEach((q, idx) => {
          const b = document.createElement('button');
          b.className = 'px-3 py-1.5 rounded-lg text-xs font-bold border transition ' + (idx === selectedQualityIdx
            ? 'bg-emerald-600 border-emerald-600 text-white'
            : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-emerald-500');
          b.textContent = q.quality;
          b.addEventListener('click', () => {
            selectedQualityIdx = idx;
            renderServerControls();
            playSelected();
          });
          qualitiesRow.appendChild(b);
        });
      } else {
        qualityWrap.classList.add('hidden');
      }
    }

    // Play the currently selected server + quality.
    function playSelected() {
      clearAutoNext();
      const server = selectedServer();
      const quality = selectedQuality();
      if (!server || !quality) { loadEmbedFallback(); return; }
      playerContainer.classList.remove('hidden');
      if (isEmbedServer(server)) {
        resetPlayer();
        // embedwave always plays sandboxed (ads blocked): scripts +
        // same-origin so the player can run, but no popups or
        // top-navigation.
        videoIframe.setAttribute('sandbox', EMBEDWAVE_SANDBOX);
        videoIframe.src = quality.stream;
        playerContainer.classList.remove('hidden');
        return;
      }
      videoIframe.src = '';
      videoIframe.classList.add('hidden');
      nativeActive = true;
      videoNative.src = quality.stream;
      videoNative.classList.remove('hidden');
      hidePlayerStatus();
      armNativePlayTimeout();
      videoNative.play().catch(() => {});
    }

    // Native player failure: try the next quality of the same server
    // first; only when no quality is left, fall back to the sandboxed
    // embedwave server.
    function tryNextQualityOrFallback() {
      const server = selectedServer();
      if (server && !isEmbedServer(server) && selectedQualityIdx < server.qualities.length - 1) {
        selectedQualityIdx++;
        renderServerControls();
        playSelected();
        showToast('الجودة السابقة مش شغالة — جارٍ تجربة جودة أخرى…');
        return;
      }
      loadEmbedFallback();
    }

    // Embed fallback: pick the embedwave server if it exists and is not
    // already selected (sandboxed, ads blocked). When there is no embed
    // server at all, say so — never open an unsandboxed player, so no
    // popup can appear. Also forgets a dead native resolve result for
    // this key so the download button re-resolves instead of reusing
    // the dead link.
    function loadEmbedFallback() {
      if (!currentItem) return;
      playerContainer.classList.remove('hidden');
      const type = currentItem.media_type === 'tv' ? 'tv' : 'movie';
      const s = type === 'tv' ? selectedSeason : undefined;
      const e = type === 'tv' ? selectedEpisode : undefined;
      const key = resolveKey(type, currentItem.id, s, e);
      if (lastResolved && lastResolved.key === key) lastResolved = null;
      if (!currentServers) {
        showPlayerStatus('⚠️ لا يوجد مصدر شغّال لهذا العمل حالياً.');
        return;
      }
      const embedwaveIdx = currentServers.findIndex((s) => s.name === 'embedwave');
      if (embedwaveIdx >= 0 && embedwaveIdx !== selectedServerIdx) {
        selectedServerIdx = embedwaveIdx;
        selectedQualityIdx = 0;
        renderServerControls();
        playSelected();
        return;
      }
      showPlayerStatus('⚠️ لا يوجد مصدر شغّال لهذا العمل حالياً.');
    }

    function showToast(msg) {
      let toast = document.getElementById('toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast';
        toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl border border-brand-border shadow-2xl max-w-[90vw] text-center';
        document.body.appendChild(toast);
      }
      toast.innerText = msg;
      toast.classList.remove('hidden');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    // Count one view per title/episode when playback starts (fire-and-
    // forget; the same key is never counted twice in this session).
    let lastViewKey = null;
    function recordViewOnce(type, id, s, e) {
      const key = resolveKey(type, id, s, e);
      if (lastViewKey === key) return;
      lastViewKey = key;
      fetch(`${API_BASE}/api/view`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, id }),
      }).catch(() => {});
    }

    // In-App Instant Player: ad-free native <video> first, then the
    // sandboxed embedwave embed. No unsandboxed fallback exists anymore,
    // so no popup can open from the player. The Play button resumes from
    // the saved position when one exists; the restart button plays from
    // the beginning.
    btnPlayInApp.addEventListener('click', () => {
      const entry = currentResumeEntry();
      pendingResume = entry ? entry.t : null;
      playActiveStream();
    });
    document.getElementById('btnRestartPlay').addEventListener('click', () => {
      pendingResume = null;
      playActiveStream();
    });
    document.getElementById('btnAutoNextNow').addEventListener('click', () => {
      const nextBtn = autoNextEpisode ? document.querySelectorAll('.ep-btn')[autoNextEpisode - 1] : null;
      clearAutoNext();
      if (nextBtn) nextBtn.click();
    });
    document.getElementById('btnAutoNextCancel').addEventListener('click', clearAutoNext);
    // Report a problem (stage F): no backend — the report text is
    // prefilled (title, episode, server, quality, problem) and sent
    // through Telegram's share sheet to @filmatibot.
    function buildReportText(problem) {
      const title = currentItem ? (currentItem.title || currentItem.name || '—') : '—';
      const date = currentItem ? (currentItem.release_date || currentItem.first_air_date || '') : '';
      const year = date ? date.slice(0, 4) : '';
      const kind = currentItem ? (currentItem.media_type === 'tv' ? 'مسلسل' : 'فيلم') : '—';
      const type = currentItem ? (currentItem.media_type === 'tv' ? 'tv' : 'movie') : 'movie';
      const s = type === 'tv' ? selectedSeason : 0;
      const e = type === 'tv' ? selectedEpisode : 0;
      const server = selectedServer();
      const quality = selectedQuality();
      const lines = [
        '⚠️ بلاغ مشكلة — فيلماتي',
        `العمل: ${title} (${kind}${year ? ' ' + year : ''})`,
      ];
      if (type === 'tv') lines.push(`الموسم ${s} — الحلقة ${e}`);
      lines.push(`السيرفر: ${server ? server.name : '—'} — الجودة: ${quality ? quality.quality : '—'}`);
      lines.push(`المشكلة: ${problem}`);
      return lines.join('\n');
    }
    function shareReport(problem) {
      const text = buildReportText(problem);
      const url = 'https://t.me/share/url?url=' + encodeURIComponent('https://mmody1334-gif.github.io/filmaty/') + '&text=' + encodeURIComponent(text);
      window.open(url, '_blank');
    }

    document.getElementById('btnTrailer').addEventListener('click', () => {
      if (!trailerKey) return;
      resetPlayer();
      playerContainer.classList.remove('hidden');
      videoIframe.removeAttribute('sandbox');
      videoIframe.classList.remove('hidden');
      videoIframe.src = `https://www.youtube.com/embed/${trailerKey}?autoplay=1&rel=0`;
      hidePlayerStatus();
    });
    document.getElementById('btnReport').addEventListener('click', () => {
      document.getElementById('reportPicker').classList.toggle('hidden');
    });
    document.querySelectorAll('.report-problem-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.getElementById('reportPicker').classList.add('hidden');
        shareReport(btn.dataset.problem);
      });
    });
    document.getElementById('btnMyList').addEventListener('click', () => {
      if (!currentItem) return;
      const type = currentItem.media_type === 'tv' ? 'tv' : 'movie';
      const meta = { title: currentItem.title || currentItem.name || '', poster: currentItem.poster_path ? `${IMG_BASE}${currentItem.poster_path}` : '', kind: type };
      const added = toggleMyList(type, currentItem.id, meta);
      updateMyListButton();
      showToast(added ? 'تمت الإضافة لقائمتي ❤️' : 'تمت الإزالة من قائمتي');
    });

    async function playActiveStream() {
      if (!currentItem) return;
      const type = currentItem.media_type === 'tv' ? 'tv' : 'movie';
      const s = type === 'tv' ? selectedSeason : undefined;
      const e = type === 'tv' ? selectedEpisode : undefined;
      recordViewOnce(type, currentItem.id, s, e);
      playerContainer.classList.remove('hidden');
      showPlayerStatus('⏳ جاري تجهيز مشغّل بدون إعلانات...');
      const resolved = await fetchResolve(type, currentItem.id, s, e);
      selectedServerIdx = 0;
      selectedQualityIdx = 0;
      currentServers = resolved && resolved.servers ? resolved.servers : null;
      document.getElementById('downloadPicker').classList.add('hidden');
      document.getElementById('botCodePanel').classList.add('hidden');
      renderServerControls();
