plugins { id 'com.android.application' }

def ksFile = file(System.getenv("FILMATY_KEYSTORE") ?: "none")
def ksPass = System.getenv("FILMATY_KEYSTORE_PASSWORD") ?: ""

android {
    namespace 'app.filmaty'
    compileSdk 34
    defaultConfig {
        applicationId 'app.filmaty'
        minSdk 24
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName "1.${project.findProperty('versionCode') ?: '0'}"
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword ksPass
                keyAlias 'filmaty'
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
