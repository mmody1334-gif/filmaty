name: Deploy Filmaty Preview

on:
  push:
    branches: [mmody1334-gif-patch-1]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app bundle
        run: npm run build:webapp

      # Separate Worker named filmaty-preview. No cron, bot off, production untouched.
      - name: Prepare preview config
        run: |
          python3 - <<'PY'
          import re
          s = open('wrangler.toml').read()
          s = s.replace('name = "filmaty"', 'name = "filmaty-preview"', 1)
          s = re.sub(r'\[triggers\]\s*\ncrons = \[[^\]]*\]\n', '', s)
          s = s.replace('PUBLIC_BASE = "https://filmaty.hudhaifa-bio.workers.dev"', 'PUBLIC_BASE = "https://filmaty-preview.hudhaifa-bio.workers.dev"')
          open('wrangler.preview.toml', 'w').write(s)
          PY
          grep -n 'name =\|crons\|PUBLIC_BASE' wrangler.preview.toml

      - name: Deploy preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.toml --var BOT_ENABLED:0
