name: Deploy Filmaty Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      # Telegram bot is OFF by default; the website runs on its own.
      # To turn it back on: set the repo variable BOT_ENABLED = 1
      # (Settings -> Secrets and variables -> Actions -> Variables) and
      # the secret BOT_TOKEN, then re-run this workflow.
      - name: Sync Telegram bot token
        if: ${{ vars.BOT_ENABLED == '1' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          test -n "$BOT_TOKEN" || { echo "BOT_TOKEN secret is required"; exit 1; }
          printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var BOT_ENABLED:${{ vars.BOT_ENABLED == '1' && '1' || '0' }}

      # Self-heal the Telegram webhook: the Worker rejects deliveries with
      # 403 unless Telegram sends the secret_token matching its
      # WEBHOOK_SECRET, and a webhook registered without (or with a
      # different) secret leaves the bot completely dead (14 pending
      # updates, "Wrong response from the webhook: 403 Forbidden" in
      # getWebhookInfo, 2026-11-16). So on every deploy, generate one
      # fresh secret, set it as the Worker secret AND re-register the
      # webhook with it, atomically. Never prints the secret or token.
      # (v1 used the Cloudflare secrets REST API; its PUT failed in run
      # #22 with no visible reason, so v2 uses `wrangler secret put` —
      # the same tool and token that already deploy the Worker here.
      # printf '%s' (no newline) so no trailing newline lands in the
      # secret value.)
      - name: Sync Telegram webhook secret
        if: ${{ vars.BOT_ENABLED == '1' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          SECRET=$(openssl rand -hex 24)
          printf '%s' "$SECRET" | npx wrangler secret put WEBHOOK_SECRET
          test -n "$BOT_TOKEN" || { echo "BOT_TOKEN secret is required"; exit 1; }
          HOOK_RESP=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            -d "url=https://filmaty.hudhaifa-bio.workers.dev/telegram/webhook" \
            -d "secret_token=${SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]')
          echo "$HOOK_RESP" | grep -q '"ok":true' || { echo "setWebhook failed: $HOOK_RESP"; exit 1; }
          echo "Webhook secret synced."

      # Bot off: unregister the webhook so Telegram stops sending updates.
      # Skipped quietly when no BOT_TOKEN secret exists.
      - name: Remove Telegram webhook (bot disabled)
        if: ${{ vars.BOT_ENABLED != '1' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then echo "No BOT_TOKEN secret; nothing to remove."; exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/deleteWebhook" | grep -q '"ok":true' && echo "Webhook removed." || echo "deleteWebhook did not succeed (ignored)."
