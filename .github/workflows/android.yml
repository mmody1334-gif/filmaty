name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Stable signing key from repo secrets, so updates install over the
      # old app. Without the secrets the APK is signed with a throwaway
      # debug key (installs fine, but each new build needs an uninstall).
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/filmaty.jks"
            echo "FILMATY_KEYSTORE=$RUNNER_TEMP/filmaty.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set — using a debug signing key"
          fi

      - name: Build release APK
        env:
          FILMATY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk filmaty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: filmaty-apk
          path: filmaty.apk

      - name: Publish release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v1.${{ github.run_number }}"
          gh release create "$TAG" filmaty.apk \
            --title "فيلماتي للأندرويد 1.${{ github.run_number }}" \
            --notes "نزّل filmaty.apk وثبته على الموبايل." \
            --latest
